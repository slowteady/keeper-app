name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '빌드 프로파일'
        required: true
        type: choice
        options:
          - preview
          - production
      platform:
        description: '빌드 플랫폼'
        required: true
        type: choice
        options:
          - ios
          - android
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (preview)
        if: inputs.profile == 'preview'
        run: eas build --platform ${{ inputs.platform }} --profile preview --non-interactive

      - name: EAS Build (production)
        if: inputs.profile == 'production'
        run: eas build --platform ${{ inputs.platform }} --profile production --non-interactive
