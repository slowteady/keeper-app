name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '빌드 프로파일 (preview=테스트서버 dev-api / production=운영서버 api)'
        required: true
        type: choice
        options:
          - preview
          - production
      platform:
        description: '빌드 플랫폼'
        required: true
        type: choice
        options:
          - all
          - ios
          - android

concurrency:
  group: eas-build-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 타입 체크
        run: pnpm exec tsc --noEmit

      - name: 린트
        run: pnpm run lint

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (${{ inputs.profile }})
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
