name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '릴리즈 버전 (X.X.X) ⚠️ 브랜치는 main 선택'
        required: true
        type: string
        default: '2.0.7'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.PAT_TOKEN }}

      - name: Git 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 이미 릴리즈된 버전인지 확인
        run: |
          VERSION=v${{ github.event.inputs.version }}
          if git ls-remote --tags origin | grep -q "refs/tags/${VERSION}$"; then
            echo "::error::태그 ${VERSION} 이 이미 존재합니다. 이미 릴리즈된 버전은 다시 만들 수 없습니다."
            exit 1
          fi

      - name: 기존 release 브랜치 정리
        run: |
          BRANCH=release/v${{ github.event.inputs.version }}
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "미머지 상태인 ${BRANCH} 를 삭제하고 최신 develop 기준으로 다시 만듭니다."
            git push origin --delete "$BRANCH"
          fi

      - name: release 브랜치 생성
        run: git checkout -b release/v${{ github.event.inputs.version }}

      - name: package.json 버전 업데이트
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: 커밋 및 푸시
        run: |
          git add package.json
          git commit -m "CHORE: release v${{ github.event.inputs.version }}"
          git push origin release/v${{ github.event.inputs.version }}

      - name: main PR 생성
        run: |
          gh pr create \
            --base main \
            --head release/v${{ github.event.inputs.version }} \
            --title "Release v${{ github.event.inputs.version }}" \
            --body "## Release v${{ github.event.inputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: develop back-merge PR 생성
        run: |
          gh pr create \
            --base develop \
            --head release/v${{ github.event.inputs.version }} \
            --title "Release v${{ github.event.inputs.version }} → develop" \
            --body "## Release v${{ github.event.inputs.version }} back-merge"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
