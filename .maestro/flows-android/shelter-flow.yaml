appId: com.keeper.love
---
# 앱 실행 + dev client 처리 (Android)
- launchApp
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "http://10.0.2.2:8081"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "No thanks"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "No thanks"
    optional: true
- extendedWaitUntil:
    visible: "입양공고"
    timeout: 30000

# 보호소 탭 진입
- tapOn: "보호소"
- extendedWaitUntil:
    visible: "보호소명 또는 주소를 검색해주세요."
    timeout: 10000
- assertVisible: "위치설정"
- assertVisible: "보호소 찾기"

# 거리 표시 확인
- assertVisible: "1km"
- assertVisible: "5km"
- assertVisible: "10km"
- assertVisible: "30km"

# 바텀 탭 재클릭 → 스크롤 초기화
- tapOn: "보호소"
- extendedWaitUntil:
    visible: "보호소명 또는 주소를 검색해주세요."
    timeout: 5000
- assertVisible: "보호소명 또는 주소를 검색해주세요."
