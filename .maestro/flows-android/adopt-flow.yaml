appId: com.keeper.love
---
# 앱 실행 + dev client 처리 (Android)
- launchApp
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "http://10.0.2.2:8081"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "No thanks"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "No thanks"
    optional: true
- extendedWaitUntil:
    visible: "입양공고"
    timeout: 30000

# 공고 탭 진입
- tapOn: "입양공고"
- extendedWaitUntil:
    visible: "전체공고"
    timeout: 10000
- assertVisible: "전체공고"

# 카테고리 변경
- tapOn: "강아지"
- assertVisible: "전체공고"
- tapOn: "고양이"
- assertVisible: "전체공고"
- tapOn: "기타"
- assertVisible: "전체공고"
- tapOn: "전체"

# 필터 드롭다운 변경
- tapOn: "마감임박공고"
- waitForAnimationToEnd
- tapOn:
    point: "50%, 90%"
- waitForAnimationToEnd

# 카드 탭 → 상세 이동
- tapOn:
    point: "30%, 45%"
- extendedWaitUntil:
    visible: "공고기간"
    timeout: 10000
- assertVisible: "공고기간"

# 상세 → 뒤로가기
- swipe:
    start: "50%, 20%"
    end: "50%, 80%"
    duration: 300
- swipe:
    start: "50%, 20%"
    end: "50%, 80%"
    duration: 300
- tapOn:
    point: "12%, 8%"
- extendedWaitUntil:
    visible: "전체공고"
    timeout: 10000

# 필터 변경 시 스크롤 초기화
- tapOn: "고양이"
- extendedWaitUntil:
    visible: "전체공고"
    timeout: 5000
- assertVisible: "전체공고"
- tapOn: "전체"

