appId: com.keeper.love
---
# 앱 실행 + dev client 처리
- launchApp
- tapOn:
    text: '앱을 사용하는 동안 허용'
    optional: true
- tapOn:
    text: 'http://localhost:8081'
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: 'Go home'
    optional: true
- extendedWaitUntil:
    visible: 'keeper'
    timeout: 30000

# 공고 탭 진입
- tapOn: '입양공고'
- extendedWaitUntil:
    visible: '전체공고'
    timeout: 10000
- assertVisible: '전체공고'

# 카테고리 변경
- tapOn: '강아지'
- assertVisible: '전체공고'
- tapOn: '고양이'
- assertVisible: '전체공고'
- tapOn: '기타'
- assertVisible: '전체공고'
- tapOn: '전체'

# 필터 드롭다운 변경
- tapOn: '마감임박공고'
- waitForAnimationToEnd
- tapOn:
    point: '50%, 90%'
- waitForAnimationToEnd

# 검색
- tapOn: '품종 또는 지역을 입력해주세요.'
- inputText: '믹스견'
- pressKey: enter
- waitForAnimationToEnd

# 카드 탭 → 상세 이동
- tapOn:
    point: '30%, 45%'
- extendedWaitUntil:
    visible: '공고기간'
    timeout: 10000
- assertVisible: '공고기간'

# 상세 → 뒤로가기
- swipe:
    start: '50%, 20%'
    end: '50%, 80%'
    duration: 300
- swipe:
    start: '50%, 20%'
    end: '50%, 80%'
    duration: 300
- tapOn:
    point: '12%, 8%'
- extendedWaitUntil:
    visible: '전체공고'
    timeout: 10000

# 더보기 (페이지네이션)
- swipe:
    start: '50%, 80%'
    end: '50%, 10%'
    duration: 500
- swipe:
    start: '50%, 80%'
    end: '50%, 10%'
    duration: 500
- swipe:
    start: '50%, 80%'
    end: '50%, 10%'
    duration: 500
- tapOn:
    text: '더보기'
    optional: true
- waitForAnimationToEnd

# 필터 변경 시 스크롤 초기화
- tapOn:
    text: 'Dismiss'
    optional: true
- tapOn: '입양공고'
- extendedWaitUntil:
    visible: '전체공고'
    timeout: 10000
- tapOn: '고양이'
- extendedWaitUntil:
    visible: '전체공고'
    timeout: 5000
- assertVisible: '전체공고'
- tapOn: '전체'

# 풀 리프레시
- swipe:
    start: '50%, 30%'
    end: '50%, 80%'
    duration: 500
- waitForAnimationToEnd
- assertVisible: '전체공고'

# 바텀 탭 재클릭 → 스크롤 초기화
- swipe:
    start: '50%, 80%'
    end: '50%, 10%'
    duration: 500
- swipe:
    start: '50%, 80%'
    end: '50%, 10%'
    duration: 500
- tapOn: '입양공고'
- extendedWaitUntil:
    visible: '전체공고'
    timeout: 5000
- assertVisible: '전체공고'
