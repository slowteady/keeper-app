appId: com.keeper.love
---
# 프로필 진입 → social login 화면이면 dev login. 이미 로그인 상태면 skip.
- tapOn: '프로필'
- waitForAnimationToEnd
- runFlow:
    when:
      visible: 'social login'
    commands:
      - tapOn:
          id: 'dev-login-button'
      - extendedWaitUntil:
          visible: '테스터123님'
          timeout: 10000
