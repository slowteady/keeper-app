appId: com.keeper.love
---
# deeplink 로 home 진입 (iOS confirm "열기" 처리)
- openLink: 'keeper://home'
- waitForAnimationToEnd
- tapOn:
    text: '열기'
    optional: true
- tapOn:
    point: '67%,54%'
    optional: true
- tapOn:
    text: '앱을 사용하는 동안 허용'
    optional: true
- extendedWaitUntil:
    visible: '입양공고'
    timeout: 30000
