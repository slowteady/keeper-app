appId: com.keeper.love
---
# 앱 실행 + dev client 처리 (iOS)
- launchApp
- tapOn:
    text: '앱을 사용하는 동안 허용'
    optional: true
- tapOn:
    text: 'http://localhost:8081'
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: 'Continue'
    optional: true
- extendedWaitUntil:
    visible: '입양공고'
    timeout: 30000

# 커뮤니티 탭 진입
- tapOn: '커뮤니티'
- extendedWaitUntil:
    visible: '개인입양'
    timeout: 10000
- assertVisible: '개인입양'
- assertVisible: '입양생활'
- assertVisible: '궁금해요'

# 카테고리(동물 종류) 변경
- assertVisible: '전체'
- tapOn: '강아지'
- waitForAnimationToEnd
- assertVisible: '최신순'
- tapOn: '고양이'
- waitForAnimationToEnd
- tapOn: '기타'
- waitForAnimationToEnd
- tapOn: '전체'
- waitForAnimationToEnd

# 상단 카테고리 탭 전환
- tapOn: '입양생활'
- waitForAnimationToEnd
- assertVisible: '개인입양'
- tapOn: '궁금해요'
- waitForAnimationToEnd
- tapOn: '개인입양'
- extendedWaitUntil:
    visible: '최신순'
    timeout: 5000

# 카드 스크롤 + 페이지네이션 (더보기)
- swipe:
    start: '50%, 80%'
    end: '50%, 10%'
    duration: 500
- swipe:
    start: '50%, 80%'
    end: '50%, 10%'
    duration: 500
- swipe:
    start: '50%, 80%'
    end: '50%, 10%'
    duration: 500
- swipe:
    start: '50%, 80%'
    end: '50%, 10%'
    duration: 500
- tapOn:
    text: '더보기'
    optional: true
- waitForAnimationToEnd

# 풀 리프레시
- tapOn: '커뮤니티'
- extendedWaitUntil:
    visible: '개인입양'
    timeout: 5000
- swipe:
    start: '50%, 30%'
    end: '50%, 80%'
    duration: 500
- waitForAnimationToEnd
- assertVisible: '개인입양'

# 바텀 탭 재클릭 → 스크롤 초기화 확인
- swipe:
    start: '50%, 80%'
    end: '50%, 10%'
    duration: 500
- swipe:
    start: '50%, 80%'
    end: '50%, 10%'
    duration: 500
- tapOn: '커뮤니티'
- extendedWaitUntil:
    visible: '개인입양'
    timeout: 5000
- assertVisible: '개인입양'
