appId: com.keeper.love
---
# 앱 실행 + dev client 처리 (iOS)
- launchApp
- tapOn:
    text: '앱을 사용하는 동안 허용'
    optional: true
- tapOn:
    text: 'http://localhost:8081'
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: 'Continue'
    optional: true
- extendedWaitUntil:
    visible: '입양공고'
    timeout: 30000

# 커뮤니티 탭 진입
- tapOn: '커뮤니티'
- extendedWaitUntil:
    visible: '개인입양'
    timeout: 10000
- assertVisible: '개인입양'
- assertVisible: '입양생활'
- assertVisible: '궁금해요'

# 카테고리(동물 종류) 변경
- assertVisible: '전체'
- tapOn: '강아지'
- waitForAnimationToEnd
- assertVisible: '최신순'
- tapOn: '고양이'
- waitForAnimationToEnd
- tapOn: '기타'
- waitForAnimationToEnd
- tapOn: '전체'
- waitForAnimationToEnd

# 상단 카테고리 탭 전환
- tapOn: '입양생활'
- waitForAnimationToEnd
- assertVisible: '개인입양'
- tapOn: '궁금해요'
- waitForAnimationToEnd
- tapOn: '개인입양'
- extendedWaitUntil:
    visible: '최신순'
    timeout: 5000

# 카드 스크롤 + 페이지네이션 (더보기)
- swipe:
    start: '50%, 80%'
    end: '50%, 10%'
    duration: 500
- swipe:
    start: '50%, 80%'
    end: '50%, 10%'
    duration: 500
- swipe:
    start: '50%, 80%'
    end: '50%, 10%'
    duration: 500
- swipe:
    start: '50%, 80%'
    end: '50%, 10%'
    duration: 500
- tapOn:
    text: '더보기'
    optional: true
- waitForAnimationToEnd

# 풀 리프레시
- tapOn: '커뮤니티'
- extendedWaitUntil:
    visible: '개인입양'
    timeout: 5000
- swipe:
    start: '50%, 30%'
    end: '50%, 80%'
    duration: 500
- waitForAnimationToEnd
- assertVisible: '개인입양'

# 바텀 탭 재클릭 → 스크롤 초기화 확인
- swipe:
    start: '50%, 80%'
    end: '50%, 10%'
    duration: 500
- swipe:
    start: '50%, 80%'
    end: '50%, 10%'
    duration: 500
- tapOn: '커뮤니티'
- extendedWaitUntil:
    visible: '개인입양'
    timeout: 5000
- assertVisible: '개인입양'

# 정렬 chip 토글 — 최신순 / 인기순 / 댓글순 / 조회순
- tapOn: '최신순'
- waitForAnimationToEnd
- tapOn: '인기순'
- waitForAnimationToEnd
- assertVisible: '인기순'
- tapOn: '인기순'
- waitForAnimationToEnd
- tapOn: '댓글순'
- waitForAnimationToEnd
- assertVisible: '댓글순'
- tapOn: '댓글순'
- waitForAnimationToEnd
- tapOn: '조회순'
- waitForAnimationToEnd
- assertVisible: '조회순'
- tapOn: '조회순'
- waitForAnimationToEnd
- tapOn: '최신순'
- waitForAnimationToEnd
- assertVisible: '최신순'

# 좋아요 인증 가드 — 비로그인 상태에서 하트 탭 시 로그인 모달 노출
# (실제 토글/낙관 업데이트는 로그인 필요해 e2e 범위 밖)
- tapOn:
    point: '92%, 40%'
- waitForAnimationToEnd
- assertVisible:
    text: '로그인이 필요해요'
    optional: true
- tapOn:
    text: '닫기'
    optional: true
- waitForAnimationToEnd

# 카드 본문 탭 → 상세 진입 (하트 영역 밖이면 cardTap 활성)
- tapOn:
    point: '50%, 50%'
- extendedWaitUntil:
    visible: '말티즈'
    timeout: 5000

# 상세 페이지의 하트도 동일 가드 동작
- tapOn:
    point: '75%, 18%'
- waitForAnimationToEnd
- assertVisible:
    text: '로그인이 필요해요'
    optional: true
- tapOn:
    text: '닫기'
    optional: true
- waitForAnimationToEnd

# 뒤로가기 → 목록 복귀
- tapOn:
    point: '8%, 9%'
    optional: true
- waitForAnimationToEnd
