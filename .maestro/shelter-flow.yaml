appId: com.keeper.love
---
# 앱 실행 + dev client 처리
- launchApp
- tapOn:
    text: '앱을 사용하는 동안 허용'
    optional: true
- tapOn:
    text: 'http://localhost:8081'
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: 'Go home'
    optional: true
- extendedWaitUntil:
    visible: 'keeper'
    timeout: 30000

# 보호소 탭 진입
- tapOn: '보호소'
- extendedWaitUntil:
    visible: '보호소명 또는 주소를 검색해주세요.'
    timeout: 10000
- assertVisible: '위치설정'
- assertVisible: '보호소 찾기'

# 거리 표시 확인
- assertVisible: '1km'
- assertVisible: '5km'
- assertVisible: '10km'
- assertVisible: '30km'

# 보호소 검색
- tapOn: '보호소명 또는 주소를 검색해주세요.'
- inputText: '남산'
- pressKey: enter
- waitForAnimationToEnd

# 주소 검색 (바텀시트)
- tapOn: '보호소'
- extendedWaitUntil:
    visible: '위치설정'
    timeout: 5000
- tapOn: '위치설정'
- waitForAnimationToEnd
- tapOn:
    point: '50%, 72%'
- inputText: '서초구'
- pressKey: enter
- waitForAnimationToEnd
- tapOn:
    point: '50%, 55%'
    optional: true
- waitForAnimationToEnd

# 바텀 탭 재클릭 → 스크롤 초기화
- tapOn: '보호소'
- extendedWaitUntil:
    visible: '보호소명 또는 주소를 검색해주세요.'
    timeout: 5000
- assertVisible: '보호소명 또는 주소를 검색해주세요.'
